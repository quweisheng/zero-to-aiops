<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>原生页面 | 前端事件实验</title>
  </head>
  <body>
    <nav aria-label="实验版本">
      <a href="/">原生页面</a><a href="/vue.html">Vue</a><a href="/react.html">React</a>
    </nav>
    <main>
      <h1>原生事件看板</h1>
      <p>只有合成数据。试试正常、空结果、503、慢响应和非法数据。</p>
      <form id="search-form">
        <label for="query">按事件号或服务搜索</label>
        <input id="query" name="query" autocomplete="off" placeholder="例如 database">
        <label for="mode">故障模式</label>
        <select id="mode" name="mode">
          <option value="normal">正常</option>
          <option value="empty">空结果</option>
          <option value="error">HTTP 503</option>
          <option value="slow">慢响应（4 秒）</option>
          <option value="invalid">非法契约</option>
        </select>
        <div class="actions">
          <button type="submit">查询</button>
          <button type="button" id="cancel" disabled>取消</button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite">尚未查询</p>
      <ul id="incidents"></ul>
    </main>
    <script type="module" src="/src/vanilla.ts"></script>
  </body>
</html>
